# WXD/IBM ONLY — DO NOT UPSTREAM. One native worker per 96-GiB GPU.
# Merge these keys into each GPU worker's etc/config.properties. Identity,
# ports, discovery and host/query memory budgets are deployment-specific.
cudf.enabled=true
task.max-drivers-per-task=2
async-data-cache-enabled=true
runtime-metrics-collection-enabled=true
exchange.max-buffer-size=512MB
sink.max-buffer-size=512MB
local-exchange.max-buffer-size=536870912

# Keep the validated compressed baseline explicit. Other cuDF/UCXX options
# and absent UCX/KvikIO environment values come from the pinned Velox profile.
cudf.exchange=true
cudf.exchange_compression=column-adaptive-freq-pfor-min128
cudf.exchange_compression_allow_cuda_ipc=true
cudf.hive.use-buffered-input=false
cudf.cache_host_registration_enabled=true
cudf.cache_host_registration_max_bytes=34359738368
