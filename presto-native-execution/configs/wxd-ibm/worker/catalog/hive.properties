# WXD/IBM ONLY — DO NOT UPSTREAM. Native worker catalog, not Java catalog.
# Merge into etc/catalog/hive.properties; retain your S3 region/credential keys.
connector.name=hive
# Applies to AWS SDK reads, including the BufferedInput alternative.
# KvikIO's separate REQUIRE setting is supplied by the pinned Velox runtime.
hive.s3.ssl.enabled=true
hive.s3.direct-receive-mode=required
hive.s3.adaptive-tcp-mss-enabled=true
